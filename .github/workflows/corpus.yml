name: Corpus

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: v1/go/go.mod
          cache-dependency-path: v1/go/go.sum
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm ci
        working-directory: v1
      - run: npm run build
        working-directory: v1
      - run: npm test
        working-directory: v1
      - run: go test -count=1 ./...
        working-directory: v1/go
